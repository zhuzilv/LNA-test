<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>LNA Test</title>
</head>
<body>
  <h3>LNA localhost test</h3>

  <button onclick="callLocal()">fetch localhost</button>
  <pre id="out">waiting</pre>

  <script>
    async function callLocal() {
      const out = document.getElementById('out')
      out.textContent = 'loading...'

      try {
        const url = 'http://127.0.0.1:18080/ping'
        const res = await fetch(url, { mode: 'cors' })
        out.textContent = 'SUCCESS\n' + await res.text()
      } catch (e) {
        out.textContent = 'FAILED\n' + e.message
      }
    }
  </script>
</body>
</html>
